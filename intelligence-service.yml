server:
  port: 9030
  servlet.context-path: /intelligence

spring:
  datasource:
    url: jdbc:postgresql://localhost:9010/lovable-intelligence-db
    username: user
    password: password
    driver-class-name: org.postgresql.Driver
  ai:
    model.chat: openai
    openai:
      api-key: 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
      base-url: https://openrouter.ai/api/v1
      chat:
        options:
          model: google/gemini-3-flash-preview
          temperature: 0.2
      embedding:
        options:
          model: qwen/qwen3-embedding-8b

---

spring:
  config:
    activate:
      on-profile: k8s
  datasource:
    url: jdbc:postgresql://pgvector.lovable-core.svc.cluster.local:5432/intelligence_db
    username: intelligence_user
    password: ${DB_PASSWORD}
ai:
    openai:
      api-key: ${AI_API_KEY}
      chat:
        options:
          model: google/gemini-3-flash-preview
